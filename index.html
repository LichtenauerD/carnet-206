<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet 206+</title>
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet 206+">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --fond:#f4f5f7; --carte:#ffffff; --carte-2:#f0f1f4; --texte:#16181b; --texte-2:#5b6068; --texte-3:#8a9099;
  --trait:#e3e5e9; --accent:#2a78d6; --accent-doux:#e6f0fb; --accent-texte:#ffffff;
  --ok:#0ca30c; --attention:#fab219; --retard:#d03b3b; --inconnu:#8a9099;
  --ok-fond:#e7f6e7; --attention-fond:#fff4dc; --retard-fond:#fbe7e7; --inconnu-fond:#eef0f2;
  --serie:#2a78d6; --ombre:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --rayon:16px; --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --fond:#111214; --carte:#1c1e21; --carte-2:#26292d; --texte:#f0f1f2; --texte-2:#b3b8bf; --texte-3:#878d95;
    --trait:#2e3136; --accent:#3987e5; --accent-doux:#1b2a3d; --serie:#3987e5;
    --ok-fond:#15281a; --attention-fond:#2e2614; --retard-fond:#321818; --inconnu-fond:#25282c;
    --ombre:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:var(--sat);padding-bottom:calc(76px + var(--sab));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--texte-3);font-weight:600;margin:22px 4px 8px}
h3{font-size:17px;margin:0 0 4px;font-weight:600}
p{margin:0 0 10px}
a{color:var(--accent)}
.vue{display:none;padding:12px 16px 24px;max-width:640px;margin:0 auto}
.vue.active{display:block}
.entete{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 4px 6px}
.entete .sous{color:var(--texte-2);font-size:14px;margin-top:4px}
.carte{background:var(--carte);border-radius:var(--rayon);box-shadow:var(--ombre);padding:16px;margin-bottom:12px}
.carte.plate{padding:0;overflow:hidden}
.liste-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--trait);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.liste-item:first-child{border-top:0}
.liste-item .corps{flex:1;min-width:0}
.liste-item .titre{font-weight:500}
.liste-item .detail{color:var(--texte-2);font-size:14px}
.liste-item .droite{color:var(--texte-2);font-size:14px;text-align:right;white-space:nowrap}
.chevron{color:var(--texte-3);font-size:20px;line-height:1}
.pastille{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pastille .ico{font-size:11px;line-height:1}
.st-ok{background:var(--ok-fond);color:#0a7d0a}.st-bientot{background:var(--attention-fond);color:#8a5a00}
.st-retard{background:var(--retard-fond);color:var(--retard)}.st-inconnu{background:var(--inconnu-fond);color:var(--texte-2)}
@media (prefers-color-scheme: dark){.st-ok{color:#5fd35f}.st-bientot{color:var(--attention)}.st-retard{color:#f07a7a}}
.barre{height:4px;border-radius:2px;background:var(--carte-2);margin-top:8px;overflow:hidden}
.barre i{display:block;height:100%;border-radius:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-texte);width:100%}
.btn.second{background:var(--accent-doux);color:var(--accent)}
.btn.discret{background:var(--carte-2);color:var(--texte)}
.btn.danger{background:var(--retard-fond);color:var(--retard)}
.btn.petit{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.rangee{display:flex;gap:10px}.rangee>*{flex:1}
.voiture{display:block;width:100%;max-width:420px;margin:0 auto;height:auto}
.km-gros{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.muet{color:var(--texte-2);font-size:14px}
.tres-muet{color:var(--texte-3);font-size:13px}
.alerte{border-radius:var(--rayon);padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start}
.alerte.att{background:var(--attention-fond)}.alerte.ret{background:var(--retard-fond)}.alerte.info{background:var(--accent-doux)}
.alerte b{display:block}
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tuile{background:var(--carte);border-radius:14px;padding:14px;box-shadow:var(--ombre)}
.tuile .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tuile .lib{font-size:13px;color:var(--texte-2)}
/* barre d'onglets */
.onglets{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--carte) 88%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--trait);display:flex;padding:6px 4px calc(6px + var(--sab));z-index:20}
.onglets button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--texte-3);padding:4px 0;cursor:pointer}
.onglets button svg{width:24px;height:24px}
.onglets button.actif{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(86px + var(--sab));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(42,120,214,.35);cursor:pointer;z-index:21;display:none}
body[data-vue="journal"] .fab,body[data-vue="accueil"] .fab,body[data-vue="entretien"] .fab{display:block}
/* feuilles */
.voile{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.voile.ouvert{opacity:1;pointer-events:auto}
.feuille{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--fond);border-radius:18px 18px 0 0;z-index:41;transform:translateY(105%);transition:transform .25s ease;padding:8px 16px calc(20px + var(--sab));max-width:640px;margin:0 auto;-webkit-overflow-scrolling:touch}
.feuille:not(.ouvert){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.feuille.ouvert{transform:none}
.feuille .poignee{width:38px;height:5px;border-radius:3px;background:var(--trait);margin:4px auto 10px}
.feuille .tete{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.feuille .tete h3{font-size:19px;margin:0}
.fermer{background:var(--carte-2);border:0;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--texte-2);flex:none}
.champ{display:block;margin-bottom:12px}
.champ>span{display:block;font-size:13px;color:var(--texte-2);margin:0 4px 5px}
.champ input,.champ select,.champ textarea{width:100%;background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:12px 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.champ input:focus,.champ select:focus,.champ textarea:focus{border-color:var(--accent)}
.champ textarea{min-height:70px;resize:vertical}
.aide{font-size:13px;color:var(--texte-3);margin:-6px 4px 12px}
.choix{display:grid;gap:8px;margin-bottom:12px}
.choix label{display:flex;gap:12px;align-items:center;background:var(--carte);border:1.5px solid var(--trait);border-radius:12px;padding:12px 14px;cursor:pointer}
.choix input{accent-color:var(--accent);width:20px;height:20px;flex:none}
.choix label:has(input:checked){border-color:var(--accent);background:var(--accent-doux)}
.puces{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.puces button{border:1.5px solid var(--trait);background:var(--carte);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.puces button.actif{border-color:var(--accent);background:var(--accent-doux);color:var(--accent);font-weight:600}
.segment{display:flex;background:var(--carte-2);border-radius:10px;padding:3px;margin-bottom:12px;overflow-x:auto}
.segment button{flex:1;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--texte-2)}
.segment button.actif{background:var(--carte);color:var(--texte);font-weight:600;box-shadow:var(--ombre)}
.interrupteur{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.interrupteur input{width:46px;height:28px;-webkit-appearance:none;appearance:none;background:var(--trait);border-radius:999px;position:relative;cursor:pointer;transition:background .2s;flex:none}
.interrupteur input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.interrupteur input:checked{background:var(--ok)}.interrupteur input:checked::after{left:21px}
.ops-coches{background:var(--carte);border-radius:12px;border:1px solid var(--trait);margin-bottom:12px;max-height:260px;overflow:auto}
.ops-coches label{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--trait);font-size:15px}
.ops-coches label:first-child{border-top:0}
.ops-coches input{accent-color:var(--accent);width:19px;height:19px}
.mois{font-size:13px;color:var(--texte-3);font-weight:600;margin:16px 4px 6px;text-transform:capitalize}
.ic-rond{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--carte-2);font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--texte);color:var(--fond);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.vu{opacity:1;transform:translateX(-50%)}
.sync{font-size:12px;color:var(--texte-3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--inconnu);display:inline-block}
.sync.ok i{background:var(--ok)}.sync.err i{background:var(--retard)}.sync.cours i{background:var(--attention)}
.etapes{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}
.etapes i{width:7px;height:7px;border-radius:50%;background:var(--trait)}.etapes i.fait{background:var(--accent)}
.accueil-config{min-height:calc(100vh - 40px);display:flex;flex-direction:column}
.graph{width:100%;height:auto;display:block;overflow:visible}
.graph text{fill:var(--texte-2);font-size:11px}
.graph .axe{stroke:var(--trait)}
.graph rect.b{fill:var(--serie)}
.bulle{position:absolute;background:var(--texte);color:var(--fond);font-size:13px;padding:6px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.code{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--carte-2);padding:8px 10px;border-radius:8px;word-break:break-all;display:block;margin:6px 0 10px}
ol.guide{padding-left:20px;margin:0 0 10px}ol.guide li{margin-bottom:6px}
.niv{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px}
.niv.eleve{background:var(--retard)}.niv.moyen{background:var(--attention)}.niv.faible{background:var(--inconnu)}.niv.info{background:var(--accent)}
.badge-src{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--carte-2);color:var(--texte-2);font-weight:600}
.vide{text-align:center;color:var(--texte-2);padding:28px 16px}
</style>
</head>
<body data-vue="accueil">

<!-- ACCUEIL -->

  <div class="entete">
    <div><h1 id="a-nom">Ma 206+</h1><div class="sous" id="a-sous"></div></div>

  <button data-vue="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Historique</button>
  <button data-vue="couts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Dépenses</button>

<script>
'use strict';
const M = window.MOTEUR, P = window.PLANS;
const CLE = 'carnet206.donnees', CLE_SYNC = 'carnet206.sync';
let D = M.normaliser(lireLocal());
let SYNC = Object.assign({ token: '', depot: 'LichtenauerD/carnet-206-donnees', chemin: 'donnees.json', derniere: null, etat: 'local', message: '' }, lireJSON(CLE_SYNC));

// ---------- utilitaires ----------
function lireJSON(k) { try { return JSON.parse(localStorage.getItem(k) || 'null') || {}; } catch (e) { return {}; } }
function lireLocal() { try { return JSON.parse(localStorage.getItem(CLE) || 'null'); } catch (e) { return null; } }
function ecrireLocal() { try { localStorage.setItem(CLE, JSON.stringify(D)); } catch (e) {} }
function sauverSyncCfg() { try { localStorage.setItem(CLE_SYNC, JSON.stringify(SYNC)); } catch (e) {} }
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => n == null || isNaN(n) ? '—' : Math.round(n).toLocaleString('fr-FR');
const euros = n => n == null || isNaN(n) ? '—' : n.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: n >= 100 ? 0 : 2 });
const isoAuj = () => M.versIso(M.aujourdhui());
function dateFr(iso, court) {
  if (!iso) return '—';
  const d = M.versDate(iso);
  return d.toLocaleDateString('fr-FR', court ? { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' } : { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
}
function dans(j) {
  if (j == null) return '';
  if (j < 0) return `en retard de ${duree(-j)}`;
  if (j === 0) return "aujourd'hui";
  return `dans ${duree(j)}`;
}
function duree(j) {
  if (j < 45) return `${j} j`;
  if (j < 730) return `${Math.round(j / 30.44)} mois`;
  const a = j / 365.25; return `${a.toFixed(a < 10 ? 1 : 0).replace('.', ',')} ans`;
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('vu'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('vu'), 2400); }
const STATUTS = {
  ok: { lib: 'À jour', ico: '✓', cls: 'st-ok', coul: 'var(--ok)' },
  bientot: { lib: 'Bientôt', ico: '!', cls: 'st-bientot', coul: 'var(--attention)' },
  retard: { lib: 'En retard', ico: '✕', cls: 'st-retard', coul: 'var(--retard)' },
  inconnu: { lib: 'À renseigner', ico: '?', cls: 'st-inconnu', coul: 'var(--inconnu)' }
};
const pastille = s => `<span class="pastille ${STATUTS[s].cls}"><span class="ico">${STATUTS[s].ico}</span>${STATUTS[s].lib}</span>`;
const ICONES = { huile: '🛢️', filtre: '🌀', bougie: '⚡', frein: '🛑', distri: '⚙️', essieu: '🔩', batterie: '🔋', pneu: '🛞', refroid: '🌡️', clim: '❄️', essuie: '🌧️', ct: '📋', assurance: '🛡️' };

let vue3D = null, plaque3D = null;
function monter3D() {
  if (!window.Voiture3D) return;
  const plaque = (D.vehicule.immatriculation || '').toUpperCase();
  if (vue3D && plaque3D === plaque) return;
  const c = $('#a-3d');
  if (vue3D) { vue3D.renderer.setAnimationLoop(null); vue3D.renderer.dispose(); vue3D.renderer.domElement.remove(); vue3D = null; }
  c.style.display = 'block';
  try { vue3D = window.Voiture3D.monter(c, { plaque }); } catch (e) { vue3D = null; }
  if (!vue3D) { c.style.display = 'none'; window.Voiture3D = null; }
  plaque3D = plaque;
}

function ligneEcheance(e) {
  const s = STATUTS[e.statut];
  let det;
  if (e.statut === 'inconnu') det = 'Dernière fois inconnue';
  else {
    det = `${dateFr(e.date, true)} · ${dans(e.joursRestants)}`;
    if (e.critere === 'km' && e.km) det = `${nf(e.km)} km (≈ ${dateFr(e.date, true)}) · ${dans(e.joursRestants)}`;
  }
  const pct = Math.min(e.progression, 1) * 100;
  return `<button class="liste-item" data-op="${e.op.id}">
    <div class="ic-rond">${ICONES[e.op.icone] || '•'}</div>
    <div class="corps"><div class="titre">${esc(e.op.nom)}</div><div class="detail">${det}</div>
    ${e.statut !== 'inconnu' ? `<div class="barre"><i style="width:${pct}%;background:${s.coul}"></i></div>` : ''}</div>
    ${pastille(e.statut)}</button>`;
}

function rendreEntretien() {
  const ech = M.toutesEcheances(D);

  const titres = { retard: 'En retard', bientot: 'À prévoir', ok: 'À jour', inconnu: 'À renseigner (dernière fois inconnue)' };
  let h = '';
  ['retard', 'bientot', 'ok', 'inconnu'].forEach(k => { if (grp[k].length) h += `<h2>${titres[k]}</h2><div class="carte plate">${grp[k].map(ligneEcheance).join('')}</div>`; });

  h += `<h2>Dernières réparations</h2><div class="carte plate">${reps.length ? reps.slice(0, 5).map(i => `<button class="liste-item" data-j="intervention:${i.id}"><div class="ic-rond">🛠️</div><div class="corps"><div class="titre">${esc(i.libelle)}</div><div class="detail">${esc(nomCategorie(i.categorie))} · ${dateFr(i.date, true)}</div></div><div class="droite">${+i.cout ? euros(+i.cout) : ''}</div></button>`).join('') : '<div class="vide" style="padding:18px">Aucune réparation. Touche + après un passage au garage.</div>'}</div>`;

}

  const l = [];

function rendreCouts() {
  const s = M.statistiques(D);
  const annees = Object.keys(s.parAnnee).sort();
  let h = `<div class="tuiles">
    <div class="tuile"><div class="val">${euros(s.total12)}</div><div class="lib">Dépensé sur 12 mois</div></div>
    <div class="tuile"><div class="val">${s.coutKm != null ? s.coutKm.toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' €' : '—'}</div><div class="lib">Coût par km (12 mois)</div></div>
    <div class="tuile"><div class="val">${s.consoMoy != null ? s.consoMoy.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' L' : '—'}</div><div class="lib">Conso moyenne /100 km</div></div>
    <div class="tuile"><div class="val">${s.prixLitre.length ? (s.prixLitre.reduce((a, b) => a + b.prix, 0) / s.prixLitre.length).toLocaleString('fr-FR', { maximumFractionDigits: 3 }) + ' €' : '—'}</div><div class="lib">Prix moyen du litre</div></div>
  </div>`;
  h += `<h2>Dépenses par année</h2><div class="carte" style="position:relative">${annees.length ? grapheBarres(annees.map(a => ({ lib: a, val: s.parAnnee[a] }))) : '<div class="vide">Aucune dépense enregistrée.</div>'}<div class="bulle" id="bulle"></div></div>`;
  const cats = Object.entries(s.parCategorie).sort((a, b) => b[1] - a[1]);
  const tot = cats.reduce((x, c) => x + c[1], 0);
  if (cats.length) h += `<h2>Par catégorie (total)</h2><div class="carte plate">${cats.map(([c, v]) => `<div class="liste-item" style="cursor:default"><div class="corps"><div class="titre">${esc(c)}</div><div class="barre"><i style="width:${v / tot * 100}%;background:var(--serie)"></i></div></div><div class="droite">${euros(v)}<br><span class="tres-muet">${Math.round(v / tot * 100)} %</span></div></div>`).join('')}</div>`;
  if (s.conso.length) h += `<h2>Consommation (plein à plein)</h2><div class="carte plate">${s.conso.slice(-8).reverse().map(c => `<div class="liste-item" style="cursor:default"><div class="corps"><div class="titre">${c.l100.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} L/100 km</div><div class="detail">${dateFr(c.date, true)} · ${nf(c.km)} km</div></div></div>`).join('')}</div>`;
  else h += `<p class="tres-muet" style="margin:8px 4px">La consommation se calcule entre deux pleins complets avec le kilométrage.</p>`;
  $('#c-contenu').innerHTML = h;
  const g = $('#c-contenu svg.graph');
  if (g) $$('rect.zone', g).forEach(r => {
    const montrer = () => { const b = $('#bulle'); const box = r.getBoundingClientRect(), par = b.parentElement.getBoundingClientRect(); b.textContent = `${r.dataset.lib} : ${euros(+r.dataset.val)}`; b.style.left = (box.left - par.left + box.width / 2) + 'px'; b.style.top = (+r.dataset.y / 200 * g.getBoundingClientRect().height + 16) + 'px'; b.style.display = 'block'; };
    r.addEventListener('pointerenter', montrer); r.addEventListener('click', montrer);
    r.addEventListener('pointerleave', () => $('#bulle').style.display = 'none');
  });
}
function grapheBarres(donnees) {
  const W = 320, H = 200, g = 34, b = 22, haut = 12;
  const max = Math.max(...donnees.map(d => d.val)) || 1;
  const pas = Math.pow(10, Math.floor(Math.log10(max))); const nice = Math.ceil(max / pas) * pas;
  const larg = (W - g) / donnees.length, lb = Math.min(36, larg * 0.6);
  let s = `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses par année">`;
  [0, .5, 1].forEach(f => { const y = H - b - f * (H - b - haut); s += `<line class="axe" x1="${g}" x2="${W}" y1="${y}" y2="${y}"/><text x="${g - 6}" y="${y + 4}" text-anchor="end">${nf(nice * f)}</text>`; });
  donnees.forEach((d, i) => {
    const hh = d.val / nice * (H - b - haut), x = g + i * larg + (larg - lb) / 2, y = H - b - hh;
    const r = Math.min(4, hh);
    s += `<path d="M${x},${H - b} V${y + r} Q${x},${y} ${x + r},${y} H${x + lb - r} Q${x + lb},${y} ${x + lb},${y + r} V${H - b} Z" fill="var(--serie)"/>`;
    s += `<text x="${x + lb / 2}" y="${H - 6}" text-anchor="middle">${d.lib}</text>`;
    s += `<rect class="zone" x="${g + i * larg}" y="0" width="${larg}" height="${H - b}" fill="transparent" data-lib="${d.lib}" data-val="${d.val}" data-y="${y}"/>`;
  });
  return s + '</svg>';
}

// ---------- Passage au garage : une ligne par travail, comme sur la facture ----------
// Raccourcis : uniquement les pièces systématiquement remplacées.
const RAPIDES = {
  'Révision': ['vidange'],
  'Distribution': ['distribution'],
  'Contrôle technique': ['controle_technique'],
  '4 pneus neufs': ['pneus_avant', 'pneus_arriere']
};
// Révision : liste à cocher, facture sous les yeux. Rien de coché = seule la vidange compte.
const REV_PIECES = ['filtre_air', 'filtre_habitacle', 'bougies', 'filtre_gasoil', 'liquide_frein', 'liquide_refroidissement', 'courroie_accessoires', 'essuie_glaces', 'clim'];
const REV_CONTROLES = ['niveaux', 'freins_controle', 'pneus', 'train_avant', 'train_arriere', 'batterie', 'amortisseurs'];
function lignesDe(x) {
  if (x.lignes && x.lignes.length) return x.lignes.map(l => Object.assign({}, l));
  const ops = M.operationsActives(D), l = [];
  const ctl = x.type === 'reparation' ? (P.REPARATIONS.find(c => c.id === x.categorie) || {}).controle : null;
  if (x.type === 'reparation') l.push({ libelle: x.libelle || 'Réparation', categorie: x.categorie || 'autre', ops: (x.operations || []).filter(id => id !== ctl) });
  else (x.operations || []).forEach(id => { const o = ops.find(q => q.id === id); if (o) l.push({ libelle: o.nom, categorie: 'carnet', ops: [id] }); });
  if (!l.length && x.libelle) l.push({ libelle: x.libelle, categorie: 'autre', ops: [] });
  return l;
}
function formIntervention(ex, opsPre, modeRevision) {
  const ops = M.operationsActives(D), moteur = D.vehicule.moteur || 'tu3';
  const nomOp = id => (ops.find(o => o.id === id) || {}).nom;
  const actif = id => ops.some(o => o.id === id);
  const x = ex || { date: isoAuj(), km: '', operations: opsPre || [], libelle: '', garage: '', moiMeme: false, cout: '', notes: '' };
  let lignes = lignesDe(x);
  let parcours = null;           // catégorie parcourue quand la recherche est vide
  const ctlCoches = new Set(ex ? (x.operations || []).filter(id => P.REPARATIONS.some(c => c.controle === id)) : []);
  const nomCat = id => id === 'carnet' ? "Carnet d'entretien" : nomCategorie(id);
  ouvrir(`${tete(ex ? 'Modifier le passage' : modeRevision ? 'Révision' : 'Passage au garage')}
    <label class="champ"><span>Qu'est-ce qui a été fait ?</span><input id="g-q" placeholder="Tape un mot : vidange, rotule, frein…" autocomplete="off" autocorrect="off"></label>
    <p class="aide">Une ligne par travail, comme sur la facture. L'appli reconnaît le travail et met le carnet à jour.</p>
    <div id="g-aide"></div>
    <div id="g-rev"></div>
    <div id="g-lignes"></div>
    <div id="g-ctl"></div>
    <div class="rangee"><label class="champ"><span>Date</span><input id="i-date" type="date" value="${x.date}"></label>
    <label class="champ"><span>Kilométrage</span><input id="i-km" type="number" inputmode="numeric" value="${x.km ?? ''}" placeholder="au compteur"></label></div>
    <label class="interrupteur"><span>Fait moi-même</span><input id="i-moi" type="checkbox" ${x.moiMeme ? 'checked' : ''}></label>
    <label class="champ" id="i-garage-c"><span>Garage</span><input id="i-garage" value="${esc(x.garage)}" placeholder="Nom du garage"></label>
    <label class="champ"><span>Coût total (€)</span><input id="i-cout" type="number" inputmode="decimal" step="0.01" value="${x.cout ?? ''}"></label>
    <label class="champ"><span>Notes</span><textarea id="i-notes" placeholder="Remarques du garagiste, pièces…">${esc(x.notes)}</textarea></label>
    <button class="btn" id="i-ok">Enregistrer</button>
    ${ex ? '<div style="height:10px"></div><button class="btn danger" id="i-suppr">Supprimer</button>' : ''}`, f => {
    const q = $('#g-q', f);
    const ajouter = l => {
      if (lignes.some(k => k.libelle === l.libelle)) return toast('Déjà dans la liste');
      lignes.push(l); q.value = ''; parcours = null; dessiner();
    };
    const ligneDepuis = e => ({ libelle: e.nom, categorie: e.categorie, ops: e.ops.filter(actif) });
    // texte libre : plusieurs travaux séparés par + , ; ou retour à la ligne
    // les morceaux qui désignent le même travail (« vidange + filtre à huile ») restent sur une seule ligne
    const ajouterTexte = t => {
      const groupes = [];
      t.split(/[+;\n]|,(?!\d)/).map(v => v.trim()).filter(Boolean).forEach(v => {
        const r = P.reconnaitre(v, moteur)[0];
        const l = r && r.phrase ? { libelle: v, categorie: r.e.categorie, ops: r.e.ops.filter(actif), cle: r.e.nom }
          : { libelle: v, categorie: (r && r.e.categorie !== 'carnet' ? r.e.categorie : P.devinerCategorie(v)) || 'autre', ops: [], cle: 'libre:' + v };
        const g = groupes.find(k => k.cle === l.cle);
        if (g) g.libelle += ' + ' + v; else groupes.push(l);
      });
      groupes.forEach(g => { delete g.cle; ajouter(g); });
    };
    function dessiner() {
      const t = q.value.trim();
      let h = '';
      if (t) {
        const tous = P.reconnaitre(t, moteur), seuil = tous.length ? Math.max(1, tous[0].score * 0.35) : 0;
        const res = tous.filter(r => r.score >= seuil).slice(0, 5);
        const top = res[0];
        const devin = top && top.phrase ? `reconnu : ${top.e.nom}` : `classé dans : ${nomCat((top && top.e.categorie !== 'carnet' ? top.e.categorie : P.devinerCategorie(t)) || 'autre')}`;
        h = `<div class="carte plate">${res.map((r, i) => `<button class="liste-item" data-r="${i}" style="padding:10px 14px"><div class="corps"><div class="titre" style="font-size:15px">${esc(r.e.nom)}</div><div class="detail">${esc(r.e.catNom)}${r.e.ops.filter(actif).length ? ' · met le carnet à jour' : ''}</div></div><span class="chevron">+</span></button>`).join('')}
          <button class="liste-item" data-libre style="padding:10px 14px"><div class="corps"><div class="titre" style="font-size:15px">Ajouter « ${esc(t)} »</div><div class="detail">Tel quel, ${esc(devin)}</div></div><span class="chevron">+</span></button></div>`;
        f._res = res;
      } else if (parcours) {
        const c = P.REPARATIONS.find(k => k.id === parcours);
        h = `<div class="carte plate"><button class="liste-item" data-retour style="padding:10px 14px"><div class="corps"><div class="titre" style="font-size:15px">‹ ${esc(c.nom)}</div></div></button>${c.liste.map(([nom, exa], i) => `<button class="liste-item" data-p="${i}" style="padding:10px 14px"><div class="corps"><div class="titre" style="font-size:15px">${esc(nom)}</div></div><span class="chevron">+</span></button>`).join('')}</div>`;
      } else {
        h = `<div class="champ"><span>Raccourcis</span></div><div class="puces">${Object.keys(RAPIDES).filter(k => RAPIDES[k].some(actif)).map(k => `<button data-rap="${k}">${k}</button>`).join('')}</div>
          <div class="champ"><span>Ou choisis par partie de la voiture</span></div><div class="puces">${P.REPARATIONS.filter(c => c.liste.length).map(c => `<button data-cat="${c.id}">${esc(c.nom)}</button>`).join('')}</div>`;
      }
      $('#g-aide', f).innerHTML = h;
      // bloc révision : apparaît dès qu'une vidange figure dans le passage
      const aOp = id => lignes.some(l => l.ops.includes(id));
      if (aOp('vidange')) {
        const cases = l => l.filter(actif).map(id => `<label><input type="checkbox" data-rev="${id}" ${aOp(id) ? 'checked' : ''}>${ICONES[(ops.find(o => o.id === id) || {}).icone] || ''} ${esc(nomOp(id))}</label>`).join('');
        $('#g-rev', f).innerHTML = `<div class="carte" style="padding:12px 14px"><b>Révision : qu'est-ce qui a été fait en plus ?</b>
          <p class="aide" style="margin:4px 0 10px">Facultatif. Vidange et filtre à huile sont déjà comptés. Si tu ne sais pas, ne coche rien : tu pourras compléter plus tard depuis l'Historique.</p>
          <div class="champ"><span>Pièces ou liquides remplacés</span></div><div class="ops-coches" style="max-height:none">${cases(REV_PIECES)}</div>
          <div class="champ"><span>Contrôles écrits sur la facture</span></div><div class="ops-coches" style="max-height:none;margin-bottom:0">${cases(REV_CONTROLES)}</div></div>`;
        $$('[data-rev]', f).forEach(i => i.onchange = () => {
          const id = i.dataset.rev;
          if (i.checked) { if (!aOp(id)) lignes.push({ libelle: nomOp(id), categorie: 'carnet', ops: [id] }); }
          else lignes = lignes.filter(l => !(l.ops.length === 1 && l.ops[0] === id));
          dessiner();
        });
      } else $('#g-rev', f).innerHTML = '';
      $('#g-lignes', f).innerHTML = lignes.length ? `<div class="champ"><span>Travaux enregistrés (${lignes.length})</span></div><div class="carte plate">${lignes.map((l, i) => `<div class="liste-item" style="cursor:default;padding:10px 14px"><div class="corps"><div class="titre" style="font-size:15px">${esc(l.libelle)}</div><div class="detail">${esc(nomCat(l.categorie))}${l.ops.length ? ' · repart de zéro : ' + esc(l.ops.map(nomOp).join(', ')) : ''}</div></div><button class="fermer" data-suppr="${i}" aria-label="Retirer">✕</button></div>`).join('')}</div>` : '';
      // contrôles éventuels : jamais déduits, seulement si la facture les mentionne
      const ctls = Array.from(new Set(lignes.map(l => (P.REPARATIONS.find(c => c.id === l.categorie) || {}).controle).filter(c => c && actif(c) && !lignes.some(l => l.ops.includes(c)))));
      $('#g-ctl', f).innerHTML = ctls.map(c => `<label class="interrupteur"><span>La facture mentionne aussi : ${esc(nomOp(c))}<br><span class="tres-muet">À cocher seulement si c'est écrit. Sinon ce contrôle reste à faire.</span></span><input type="checkbox" data-ctl="${c}" ${ctlCoches.has(c) ? 'checked' : ''}></label>`).join('');
      $$('[data-ctl]', f).forEach(i => i.onchange = () => i.checked ? ctlCoches.add(i.dataset.ctl) : ctlCoches.delete(i.dataset.ctl));
      $$('[data-r]', f).forEach(b => b.onclick = () => ajouter(ligneDepuis(f._res[+b.dataset.r].e)));
      $$('[data-libre]', f).forEach(b => b.onclick = () => ajouterTexte(q.value));
      $$('[data-rap]', f).forEach(b => b.onclick = () => RAPIDES[b.dataset.rap].filter(actif).forEach(id => ajouter({ libelle: id === 'vidange' ? 'Révision (vidange et filtre à huile)' : nomOp(id), categorie: 'carnet', ops: [id] })));
      $$('[data-cat]', f).forEach(b => b.onclick = () => { parcours = b.dataset.cat; dessiner(); });
      $$('[data-retour]', f).forEach(b => b.onclick = () => { parcours = null; dessiner(); });
      $$('[data-p]', f).forEach(b => b.onclick = () => { const [nom, exa] = P.REPARATIONS.find(k => k.id === parcours).liste[+b.dataset.p]; ajouter({ libelle: nom, categorie: parcours, ops: (exa || []).filter(actif) }); });
      $$('[data-suppr]', f).forEach(b => b.onclick = () => { lignes.splice(+b.dataset.suppr, 1); dessiner(); });
    }
    q.oninput = dessiner;
    q.onkeydown = ev => { if (ev.key === 'Enter' && q.value.trim()) { ev.preventDefault(); ajouterTexte(q.value); } };
    dessiner();
    const maj = () => $('#i-garage-c', f).style.display = $('#i-moi', f).checked ? 'none' : 'block';
    $('#i-moi', f).onchange = maj; maj();
    $('#i-ok', f).onclick = () => {
      if (q.value.trim()) ajouterTexte(q.value);
      if (!lignes.length) return toast('Ajoute au moins un travail');
      const date = $('#i-date', f).value; if (!date) return toast('Indique la date');
      const operations = Array.from(new Set(lignes.flatMap(l => l.ops).concat([...ctlCoches].filter(c => lignes.some(l => (P.REPARATIONS.find(k => k.id === l.categorie) || {}).controle === c)))));
      const rep = lignes.filter(l => l.categorie !== 'carnet');
      const o = { id: ex ? ex.id : M.nouvelId(), type: rep.length ? 'reparation' : 'entretien', categorie: rep.length ? rep[0].categorie : '', lignes,
        libelle: lignes.map(l => l.libelle).join(', '), operations, date, km: $('#i-km', f).value === '' ? '' : +$('#i-km', f).value,
        moiMeme: $('#i-moi', f).checked, garage: $('#i-garage', f).value.trim(), cout: $('#i-cout', f).value === '' ? '' : +$('#i-cout', f).value, notes: $('#i-notes', f).value.trim() };
      if (operations.includes('controle_technique')) D.admin.ctDernier = D.admin.ctDernier && D.admin.ctDernier > date ? D.admin.ctDernier : date;
      modifier(d => { if (ex) d.interventions = d.interventions.map(i => i.id === ex.id ? o : i); else d.interventions.push(o); }, 'Passage enregistré, carnet mis à jour');
      fermer();
    };
    if (ex) $('#i-suppr', f).onclick = () => supprimer('interventions', ex.id);
    if (modeRevision && !lignes.some(l => l.ops.includes('vidange'))) { lignes.push({ libelle: 'Révision (vidange et filtre à huile)', categorie: 'carnet', ops: ['vidange'] }); dessiner(); }
    if (!ex && !opsPre && !modeRevision) setTimeout(() => q.focus(), 350);
  });
}

// ---------- sauvegarde GitHub ----------
const b64enc = s => { const o = new TextEncoder().encode(s); let b = ''; for (let i = 0; i < o.length; i += 0x8000) b += String.fromCharCode.apply(null, o.subarray(i, i + 0x8000)); return btoa(b); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
async function gh(methode, chemin, corps) {
  const r = await fetch(`https://api.github.com/repos/${SYNC.depot}/contents/${chemin}`, {
    method: methode, cache: 'no-store',
    headers: { 'Authorization': `Bearer ${SYNC.token}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
    body: corps ? JSON.stringify(corps) : undefined
  });
  if (r.status === 404 && methode === 'GET') return null;
  if (!r.ok) { const t = await r.text(); const e = new Error(`GitHub ${r.status}`); e.status = r.status; e.detail = t; throw e; }
  return r.json();
}
let syncEnCours = false, syncEncore = false, syncMinuterie = null;
function planifierSync() { if (!SYNC.token) return; clearTimeout(syncMinuterie); syncMinuterie = setTimeout(synchroniser, 1200); }
async function synchroniser(essai = 0) {
  if (!SYNC.token) return;
  if (syncEnCours) { syncEncore = true; return; }
  if (!navigator.onLine) { SYNC.etat = 'err'; SYNC.message = 'Hors ligne'; rendreSync(); return; }
  syncEnCours = true; SYNC.etat = 'cours'; rendreSync();
  try {
    const distant = await gh('GET', SYNC.chemin + '?ref=main');
    let fusion = D, sha;
    if (distant) { sha = distant.sha; fusion = M.fusionner(D, JSON.parse(b64dec(distant.content))); }
    if (!fusion.reglages.appUrl) fusion.reglages.appUrl = location.origin + location.pathname;
    const texte = JSON.stringify(fusion, null, 1);
    const distantTexte = distant ? b64dec(distant.content) : null;
    if (texte !== distantTexte) {
      await gh('PUT', SYNC.chemin, { message: `Carnet mis à jour (${new Date().toLocaleString('fr-FR')})`, content: b64enc(texte), sha, branch: 'main' });
    }
    // si une saisie a eu lieu pendant l'échange, on la garde et on renvoie ensuite
    const courant = D;
    if ((courant.maj || '') !== (fusion.maj || '') && courant !== fusion) { D = M.normaliser(M.fusionner(courant, fusion)); if ((courant.maj || '') > (fusion.maj || '')) syncEncore = true; }
    else D = M.normaliser(fusion);
    ecrireLocal();
    SYNC.derniere = new Date().toISOString(); SYNC.etat = 'ok'; SYNC.message = 'Sauvegardé';
  } catch (e) {
    if ((e.status === 409 || e.status === 422) && essai < 2) { syncEnCours = false; return synchroniser(essai + 1); }
    SYNC.etat = 'err';
    SYNC.message = e.status === 401 ? 'Jeton refusé' : e.status === 404 ? 'Dépôt introuvable' : e.status === 403 ? 'Accès refusé' : 'Erreur de synchro';
    console.warn(e, e.detail);
  }
  syncEnCours = false; sauverSyncCfg(); rendre();
  if (syncEncore) { syncEncore = false; planifierSync(); }
}
function rendreSync() {
  const el = $('#a-sync'); if (!el) return;
  el.className = 'sync ' + (SYNC.token ? SYNC.etat : '');
  $('span', el).textContent = !SYNC.token ? 'Local' : SYNC.etat === 'cours' ? 'Synchro…' : SYNC.etat === 'ok' ? 'Sauvegardé' : (SYNC.message || 'Synchro');
}

    <p class="muet">Les données sont enregistrées dans un dépôt <b>privé</b> de ton compte GitHub. Si tu perds le téléphone, tu réinstalles l'appli, tu remets le jeton et tout revient.</p>

      <li>Colle le jeton ci-dessous. Il reste sur cet appareil ; garde-le aussi dans ton gestionnaire de mots de passe.</li>
    </ol>
    <label class="champ"><span>Dépôt (compte/nom)</span><input id="g-depot" value="${esc(SYNC.depot)}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>

        const info = await r.json();

    if ($('#g-plus-tard', f)) $('#g-plus-tard', f).onclick = () => suite ? suite() : fermer();
  });
}

      $('#n-msg', f).textContent = 'Envoi…';
      try {
        const r = await fetch('https://ntfy.sh/', { method: 'POST', body: JSON.stringify({ topic: t, title: 'Carnet 206+', message: 'Notification de test : tout fonctionne.', tags: ['car'] }) });
        $('#n-msg', f).textContent = r.ok ? 'Envoyé. Si rien n\'arrive, vérifie l\'abonnement dans ntfy.' : 'Erreur ' + r.status;
      } catch (e) { $('#n-msg', f).textContent = 'Envoi impossible (hors ligne ?)'; }
    };
    $('#n-ok', f).onclick = () => { modifier(x => { x.reglages.ntfyTopic = t; x.reglages.rappelsActifs = $('#n-actif', f).checked; x.reglages.appUrl = location.origin + location.pathname; }); suite ? suite() : fermer(); };
  });
}
function exporter() {
  const blob = new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `carnet-206-${isoAuj()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importer() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json';
  i.onchange = async () => {
    try { const d = JSON.parse(await i.files[0].text()); if (!d.vehicule) throw 0; if (!confirm('Remplacer les données de cet appareil par ce fichier ?')) return; D = M.normaliser(d); D.maj = new Date().toISOString(); ecrireLocal(); rendre(); planifierSync(); toast('Données importées'); }
    catch (e) { toast('Fichier invalide'); }
  };
  i.click();
}

// ---------- configuration initiale ----------
let etapeConf = 0, brouillon = null;
function lancerConfiguration() {
  if (!brouillon) { brouillon = M.normaliser(D); if (!brouillon.vehicule.immatriculation) brouillon.vehicule.immatriculation = 'AB-023-VY'; }
  document.body.dataset.vue = 'config';
  $$('.vue').forEach(s => s.classList.remove('active'));
  $('.onglets').style.display = 'none';
  let v = $('#v-config');
  if (!v) { v = document.createElement('section'); v.id = 'v-config'; v.className = 'vue'; document.body.insertBefore(v, $('.fab')); }
  v.classList.add('active');
  const N = 6;
  const pts = `<div class="etapes">${Array.from({ length: N }, (_, i) => `<i class="${i <= etapeConf ? 'fait' : ''}"></i>`).join('')}</div>`;
  const nav = (suiv = 'Continuer', retour = true) => `<div style="margin-top:auto;padding-top:16px"><button class="btn" id="c-suiv">${suiv}</button>${retour ? '<div style="height:10px"></div><button class="btn discret" id="c-prec">Retour</button>' : ''}</div>`;
  const b = brouillon;
  let h = '';
  if (etapeConf === 0) h = `<div class="accueil-config">${pts}<h1 style="margin:10px 4px 4px">Carnet 206+</h1><p class="muet" style="margin:0 4px 10px">Le suivi d'entretien de ta Peugeot 206+, avec des rappels qui s'adaptent à ton kilométrage.</p>${svgVoiture()}
      <div class="carte" style="margin-top:14px"><p class="muet">On va renseigner l'essentiel en quelques écrans : le véhicule, le kilométrage, le carnet, l'administratif, puis la sauvegarde. Tout ce que tu ne connais pas encore peut être complété plus tard.</p></div>${nav('Commencer', false)}<div style="height:10px"></div><button class="btn discret" id="c-restaurer">J'ai déjà une sauvegarde GitHub</button></div>`;
  if (etapeConf === 1) h = `<div class="accueil-config">${pts}<h1 style="margin:0 4px 14px">Le véhicule</h1>${champsVehicule(b.vehicule)}${nav()}</div>`;
  if (etapeConf === 2) h = `<div class="accueil-config">${pts}<h1 style="margin:0 4px 14px">Kilométrage</h1>
      <label class="champ"><span>Kilométrage actuel au compteur</span><input id="c-km" type="number" inputmode="numeric" value="${(b.releves[b.releves.length - 1] || {}).km || ''}" placeholder="ex. 121500"></label>
      <div class="champ"><span>Environ combien de km par an ?</span></div>
      <div class="puces" id="c-kman">${[[2000, '< 3 000'], [4500, '3 000 à 6 000'], [8000, '6 000 à 10 000'], [12000, '> 10 000']].map(([val, l]) => `<button data-v="${val}" class="${Math.abs(b.vehicule.kmAn - val) < 1500 ? 'actif' : ''}">${l}</button>`).join('')}</div>
      <p class="aide">C'est un point de départ : l'appli calcule ensuite ton rythme réel à partir de tes relevés, et te demande le kilométrage plus ou moins souvent selon ce rythme.</p>${nav()}</div>`;
  if (etapeConf === 3) {
    const cles = ['vidange', 'distribution', 'filtre_air', b.vehicule.moteur === 'dv4' ? 'filtre_gasoil' : 'bougies', 'filtre_habitacle', 'liquide_frein', 'pneus_avant', 'pneus_arriere'];
    const ops = P.operationsPour(b.vehicule.moteur).filter(o => cles.includes(o.id));
    h = `<div class="accueil-config">${pts}<h1 style="margin:0 4px 6px">Le carnet</h1><p class="muet" style="margin:0 4px 14px">Dernière fois que chaque opération a été faite, et pour les pneus, quand ils ont été changés. Laisse vide ce que tu ne sais pas : tu pourras compléter plus tard.</p>
      ${ops.map(o => { const e = b.etatInitial[o.id] || {}; return `<div class="carte" style="padding:12px 14px"><div style="font-weight:600;margin-bottom:8px">${ICONES[o.icone]} ${esc(o.nom)}</div><div class="rangee"><label class="champ" style="margin:0"><span>Date</span><input type="date" data-ei="${o.id}" data-k="date" value="${e.date || ''}"></label><label class="champ" style="margin:0"><span>Km</span><input type="number" inputmode="numeric" data-ei="${o.id}" data-k="km" value="${e.km ?? ''}"></label></div></div>`; }).join('')}
      ${nav('Continuer')}</div>`;
  }
  if (etapeConf === 4) h = `<div class="accueil-config">${pts}<h1 style="margin:0 4px 14px">Administratif</h1>
      <label class="champ"><span>Date du dernier contrôle technique</span><input id="c-ct" type="date" value="${b.admin.ctDernier || ''}"></label>
      <p class="aide">Elle figure sur le procès-verbal du CT ou sur le macaron du pare-brise (mois et année de la prochaine échéance).</p>
      <label class="champ"><span>Prochaine échéance d'assurance</span><input id="c-as" type="date" value="${b.admin.assuranceEcheance || ''}"></label>
      <label class="champ"><span>Assureur</span><input id="c-asn" value="${esc(b.admin.assureur)}"></label>${nav()}</div>`;
  if (etapeConf === 5) h = `<div class="accueil-config">${pts}<h1 style="margin:0 4px 14px">Sauvegarde et rappels</h1>
      <div class="carte"><b>Sauvegarde GitHub</b><p class="muet" style="margin-top:6px">${SYNC.token ? 'Active sur ' + esc(SYNC.depot) + '.' : 'Pour ne rien perdre si tu supprimes l\'appli ou changes de téléphone.'}</p><button class="btn second" id="c-sync">${SYNC.token ? 'Modifier' : 'Configurer'}</button></div>
      <div class="carte"><b>Notifications</b><p class="muet" style="margin-top:6px">${b.reglages.ntfyTopic ? 'Sujet ntfy : ' + esc(b.reglages.ntfyTopic) : 'Rappels de garage et de kilométrage via l\'appli ntfy.'}</p><button class="btn second" id="c-ntfy">${b.reglages.ntfyTopic ? 'Voir' : 'Configurer'}</button></div>
      <p class="aide">Tu peux faire ces deux réglages plus tard, depuis l'onglet Réglages.</p>${nav('Terminer')}</div>`;
  v.innerHTML = h;
  window.scrollTo(0, 0);

  const lire = () => {
    if (etapeConf === 1) b.vehicule = lireVehicule(v, b.vehicule);
    if (etapeConf === 3) $$('[data-ei]', v).forEach(i => { const id = i.dataset.ei; b.etatInitial[id] = b.etatInitial[id] || {}; b.etatInitial[id][i.dataset.k] = i.value === '' ? null : (i.dataset.k === 'km' ? +i.value : i.value); if (!b.etatInitial[id].date) delete b.etatInitial[id]; });
    if (etapeConf === 4) { b.admin.ctDernier = $('#c-ct', v).value || null; b.admin.assuranceEcheance = $('#c-as', v).value || null; b.admin.assureur = $('#c-asn', v).value.trim(); }
  };
  if (etapeConf === 2) $$('#c-kman button', v).forEach(x => x.onclick = () => { b.vehicule.kmAn = +x.dataset.v; $$('#c-kman button', v).forEach(y => y.classList.toggle('actif', y === x)); });
  if (etapeConf === 0) $('#c-restaurer', v).onclick = () => formSync(false, () => {
    fermer();
    if (D.configure) { brouillon = null; $('#v-config').classList.remove('active'); $('.onglets').style.display = ''; allerA('accueil'); rendre(); toast('Carnet restauré'); }
    else { brouillon = M.normaliser(D); toast('Aucun carnet trouvé dans ce dépôt'); lancerConfiguration(); }
  });
  if (etapeConf === 5) {
    const retourConf = () => { fermer(); brouillon = M.normaliser(D); lancerConfiguration(); };
    $('#c-sync', v).onclick = () => { D = b; formSync(false, retourConf); };
    $('#c-ntfy', v).onclick = () => { D = b; formNtfy(false, retourConf); };
  }
  $('#c-suiv', v).onclick = () => {
    lire();
    if (etapeConf === 1 && !b.vehicule.moteur) return toast('Choisis la motorisation (tu pourras la corriger)');
    if (etapeConf === 2) {
      const km = +$('#c-km', v).value;
      if (!km) return toast('Indique le kilométrage actuel');
      const der = b.releves[b.releves.length - 1];
      if (der && der.date === isoAuj()) der.km = km; else b.releves.push({ id: M.nouvelId(), date: isoAuj(), km });
    }
    if (etapeConf === 5) {
      b.configure = true; b.maj = new Date().toISOString(); b.reglages.appUrl = location.origin + location.pathname;
      D = b; brouillon = null; ecrireLocal();
      $('#v-config').classList.remove('active'); $('.onglets').style.display = '';
      allerA('accueil'); rendre(); planifierSync(); toast('Carnet prêt');
      return;
    }
    etapeConf++; lancerConfiguration();
  };
  if ($('#c-prec', v)) $('#c-prec', v).onclick = () => { lire(); etapeConf--; lancerConfiguration(); };
}

// ---------- délégation des clics ----------
document.addEventListener('click', ev => {
  const op = ev.target.closest('[data-op]');
  if (op && !op.closest('#feuille')) return detailOp(op.dataset.op);
  const j = ev.target.closest('[data-j]');
  if (j && !j.closest('#feuille')) return ouvrirEntree(j.dataset.j);
  const a = ev.target.closest('[data-action]'); if (!a) return;
  ({
    km: formKm, ajouter: choixAjout, vehicule: formVehicule, admin: formAdmin, plan: vuePlan, points: vuePoints, sources: vueSources,
    'cfg-sync': () => formSync(), 'cfg-ntfy': () => formNtfy(), export: exporter, import: importer,
    'vers-entretien': () => allerA('entretien'), 'vers-plus': () => allerA('plus'),
    reinit: () => { if (confirm('Effacer les données de cet appareil ? La sauvegarde GitHub n\'est pas touchée.')) { localStorage.removeItem(CLE); location.reload(); } }
  })[a.dataset.action]?.();
});

// ---------- démarrage ----------
function routeInitiale() {
  const h = location.hash.replace('#', '');
  if (!D.configure) return;
  if (h === 'km') { allerA('accueil'); setTimeout(formKm, 300); }
  else if (['accueil', 'entretien', 'journal', 'couts', 'plus'].includes(h)) allerA(h);
}
window.addEventListener('hashchange', routeInitiale);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { rendre(); synchroniser(); } });
rendre();
routeInitiale();
if (SYNC.token) synchroniser();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
